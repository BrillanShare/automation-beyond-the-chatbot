<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Demo: lines sent to the LLM each month, two examples</title>
<rect width="960" height="410" fill="#161a1f"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<text x="20" y="34" font-size="17" fill="#e6edf3" font-weight="700" text-anchor="start">Lines sent to the LLM each month</text>
<text x="20" y="66" font-size="14" fill="#8b949e" font-weight="700" text-anchor="start">Example 1: match bank lines to the ledger</text>
<text x="20" y="108" font-size="16" fill="#f85149" font-weight="700" text-anchor="start">All AI</text>
<rect x="160" y="86" width="600" height="30" rx="6" fill="#21262d"/>
<rect x="160" y="86" width="450" height="30" rx="6" fill="#f85149"/>
<text x="622" y="107" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start">30</text>
<text x="160" y="134" font-size="12" fill="#8b949e" font-weight="normal" text-anchor="start">every line, every month</text>
<text x="20" y="174" font-size="16" fill="#58a6ff" font-weight="700" text-anchor="start">All script</text>
<rect x="160" y="152" width="600" height="30" rx="6" fill="#21262d"/>
<text x="172" y="173" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start">0</text>
<text x="160" y="200" font-size="12" fill="#8b949e" font-weight="normal" text-anchor="start">none: the script does all of it</text>
<text x="20" y="228" font-size="14" fill="#8b949e" font-weight="700" text-anchor="start">Example 2: categorize credit card lines</text>
<text x="20" y="270" font-size="16" fill="#f85149" font-weight="700" text-anchor="start">All AI</text>
<rect x="160" y="248" width="600" height="30" rx="6" fill="#21262d"/>
<rect x="160" y="248" width="600" height="30" rx="6" fill="#f85149"/>
<text x="772" y="269" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start">40</text>
<text x="160" y="296" font-size="12" fill="#8b949e" font-weight="normal" text-anchor="start">every line, every month</text>
<text x="20" y="336" font-size="16" fill="#bc8cff" font-weight="700" text-anchor="start">Hybrid</text>
<rect x="160" y="314" width="600" height="30" rx="6" fill="#21262d"/>
<rect x="160" y="314" width="135" height="30" rx="6" fill="#bc8cff"/>
<text x="307" y="335" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start">9</text>
<text x="160" y="362" font-size="12" fill="#8b949e" font-weight="normal" text-anchor="start">only the 9 lines no rule matched</text>
<text x="20" y="392" font-size="13" fill="#e6edf3" font-weight="normal" text-anchor="start">Building the script uses tokens once. After that, only the AI-in-the-loop part uses tokens on every run.</text>
</svg>
